name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Run fake-data tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
